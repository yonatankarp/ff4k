# Configuration for auto-generated release notes
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions
      - github-actions[bot]

  categories:
    - title: "Breaking Changes"
      labels:
        - breaking
        - breaking-change

    - title: "New Features"
      labels:
        - enhancement
        - feature

    - title: "Bug Fixes"
      labels:
        - bug
        - fix
        - bugfix

    - title: "Documentation"
      labels:
        - documentation
        - docs

    - title: "Dependencies"
      labels:
        - dependencies
        - dependency

    - title: "Other Changes"
      labels:
        - "*"