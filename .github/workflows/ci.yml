name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Ryuk is pulled from Docker Hub and only cleans up containers; runners are discarded after each job anyway.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            source:
              - '**/*.kt'
              - '**/*.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'

  code-quality:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: needs.changes.outputs.source == 'true'
        uses: actions/checkout@v7

      - name: Set up JDK 17
        if: needs.changes.outputs.source == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: needs.changes.outputs.source == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check code formatting
        if: needs.changes.outputs.source == 'true'
        run: ./gradlew spotlessCheck --no-daemon

  build-linux:
    needs: [changes, code-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        if: needs.changes.outputs.source == 'true'
        uses: actions/checkout@v7

      - name: Set up JDK 17
        if: needs.changes.outputs.source == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: needs.changes.outputs.source == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Pull the Testcontainers images up front with retries, so a registry problem fails here instead of per test.
      - name: Pull database images
        if: needs.changes.outputs.source == 'true'
        run: |
          for image in public.ecr.aws/docker/library/postgres:17-alpine public.ecr.aws/docker/library/mysql:8.4; do
            for attempt in 1 2 3; do
              timeout 120 docker pull "$image" && break
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 15))
            done
          done

      - name: Build and test
        if: needs.changes.outputs.source == 'true'
        run: ./gradlew jvmTest --no-daemon

      - name: Upload coverage data
        if: needs.changes.outputs.source == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kover-data-linux
          path: '**/build/kover/bin-reports/'
          retention-days: 1

  sonarcloud:
    needs: [changes, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: needs.changes.outputs.source == 'true' && github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        if: needs.changes.outputs.source == 'true' && github.actor != 'dependabot[bot]'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: needs.changes.outputs.source == 'true' && github.actor != 'dependabot[bot]'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download all coverage artifacts
        if: needs.changes.outputs.source == 'true' && github.actor != 'dependabot[bot]'
        uses: actions/download-artifact@v8
        with:
          pattern: kover-data-*
          path: .
          merge-multiple: true

      - name: Generate merged coverage report
        if: needs.changes.outputs.source == 'true' && github.actor != 'dependabot[bot]'
        run: ./gradlew koverXmlReport --no-daemon

      - name: SonarCloud Scan
        if: needs.changes.outputs.source == 'true' && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
