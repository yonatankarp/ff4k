site_name: FF4K
site_description: Feature Flipping for Kotlin Multiplatform
site_url: https://yonatankarp.github.io/ff4k/
repo_url: https://github.com/yonatankarp/ff4k
repo_name: yonatankarp/ff4k

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - Basics: usage/basics.md
      - Configuration: usage/configuration.md
  - Features:
      - Properties: usage/properties.md
      - Strategies: usage/strategies.md
      - Monitoring: usage/monitoring.md
  - Stores:
      - Overview: stores/index.md
      - SQLite: stores/sqlite.md
      - JDBC: stores/jdbc.md
      - R2DBC: stores/r2dbc.md
  - Customization:
      - Overview: customization/index.md
      - Custom Feature Store: customization/custom-feature-store.md
      - Custom Property Store: customization/custom-property-store.md
      - Custom Flipping Strategy: customization/custom-strategy.md
      - Contract Testing: customization/testing.md
  - Packages: packages.md
  - API Reference: api_reference.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

plugins:
  - search

extra:
  version:
    provider: mike
    default: main
